<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>DLG PHOTOS • Sem internet</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; text-align: center; }
      .c { padding: 32px 24px; max-width: 340px; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button { width: 100%; padding: 16px; border: 0; border-radius: 16px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="c">
      <img src="/icones/app-192.png" alt="DLG PHOTOS" />
      <h1>Sem internet</h1>
      <p>O app DLG PHOTOS precisa de internet. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
