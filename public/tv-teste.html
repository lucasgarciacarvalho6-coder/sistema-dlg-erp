<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>DLG PHOTOS • Teste da TV</title>
    <!-- Teste do navegador da TV (15/10/2026): mostra qual navegador é, o tamanho que ele usa para desenhar e o que
         ele entende do visual do sistema. Não lê nem grava nenhum dado do sistema; não precisa de login.
         Escrito no JavaScript mais antigo possível, para funcionar até em navegador de TV bem velho. -->
    <style>
      html, body { margin: 0; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
      .c { padding: 24px 32px; }
      h1 { font-size: 30px; margin: 0 0 4px; }
      .sub { color: #a1a1aa; font-size: 16px; margin: 0 0 18px; }
      .veredito { border-radius: 14px; padding: 14px 18px; font-size: 20px; font-weight: bold; margin-bottom: 18px; line-height: 1.35; }
      .ok { background: #052e16; border: 2px solid #22c55e; }
      .atencao { background: #422006; border: 2px solid #eab308; }
      .ruim { background: #450a0a; border: 2px solid #ef4444; }
      table { border-collapse: collapse; width: 100%; font-size: 17px; }
      td { padding: 7px 10px; border-bottom: 1px solid #27272a; vertical-align: top; }
      td.k { color: #a1a1aa; width: 42%; }
      td.v { font-weight: bold; }
      .sim { color: #4ade80; }
      .nao { color: #f87171; }
      .duas { overflow: hidden; }
      .col { float: left; width: 49%; margin-right: 2%; }
      .col.ult { margin-right: 0; }
      .ua { color: #d4d4d8; font-size: 14px; word-break: break-all; margin-top: 14px; }
      .rodape { color: #a1a1aa; font-size: 15px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="c">
      <h1>Teste do navegador da TV</h1>
      <p class="sub">Tire uma foto desta tela inteira e mande. Não mexe em nada do sistema.</p>
      <div id="veredito" class="veredito atencao">Testando...</div>
      <div class="duas">
        <div class="col">
          <table id="tabela1"></table>
        </div>
        <div class="col ult">
          <table id="tabela2"></table>
        </div>
      </div>
      <div class="ua" id="ua"></div>
      <div class="rodape" id="hora"></div>
    </div>
    <script>
      (function () {
        function suporta(prop, valor) {
          try {
            return !!(window.CSS && CSS.supports && CSS.supports(prop, valor));
          } catch (e) {
            return false;
          }
        }
        function suportaSeletor(sel) {
          try {
            return !!(window.CSS && CSS.supports && CSS.supports('selector(' + sel + ')'));
          } catch (e) {
            return false;
          }
        }
        // espaço entre itens no "flex" (gap): mede de verdade
        function temFlexGap() {
          try {
            var d = document.createElement('div');
            d.style.display = 'flex';
            d.style.flexDirection = 'column';
            d.style.rowGap = '1px';
            d.appendChild(document.createElement('div'));
            d.appendChild(document.createElement('div'));
            document.body.appendChild(d);
            var ok = d.scrollHeight === 1;
            document.body.removeChild(d);
            return ok;
          } catch (e) {
            return false;
          }
        }

        var ua = navigator.userAgent || '';
        var navegador = 'Não identificado';
        var m;
        var versaoChrome = 0;
        if ((m = ua.match(/(?:Chrome|Chromium|CrMo|CriOS)\/(\d+)/))) {
          versaoChrome = parseInt(m[1], 10);
          navegador = 'Chrome/Chromium ' + versaoChrome;
        } else if ((m = ua.match(/Firefox\/(\d+)/))) {
          navegador = 'Firefox ' + m[1];
        } else if ((m = ua.match(/Version\/(\d+[\.\d]*).*Safari/))) {
          navegador = 'Safari/WebKit ' + m[1];
        } else if ((m = ua.match(/AppleWebKit\/(\d+)/))) {
          navegador = 'WebKit ' + m[1];
        }
        var tv = [];
        var marcas = [['Tizen', 'Samsung (Tizen)'], ['Web0S', 'LG (webOS)'], ['webOS', 'LG (webOS)'], ['NETTV', 'Philips (Net TV)'], ['Philips', 'Philips'], ['Saphi', 'Philips (Saphi)'], ['TitanOS', 'Titan OS'], ['Android', 'Android'], ['BRAVIA', 'Sony'], ['HbbTV', 'HbbTV'], ['SmartTV', 'Smart TV'], ['Opera', 'Opera'], ['OPR', 'Opera'], ['Vewd', 'Vewd'], ['TV Bro', 'TV Bro'], ['BrowseHere', 'BrowseHere'], ['; wv)', 'Android WebView (motor do Android)']];
        for (var i = 0; i < marcas.length; i++) if (ua.indexOf(marcas[i][0]) >= 0 && tv.indexOf(marcas[i][1]) < 0) tv.push(marcas[i][1]);

        var dpr = window.devicePixelRatio || 1;
        var largura = window.innerWidth || document.documentElement.clientWidth;
        var altura = window.innerHeight || document.documentElement.clientHeight;

        var testes = {
          camadas: typeof window.CSSLayerBlockRule !== 'undefined',
          container: suporta('container-type', 'size'),
          cq: suporta('width', '1cqmin'),
          resize: typeof window.ResizeObserver === 'function',
          flexgap: temFlexGap(),
          lab: suporta('color', 'lab(50% 0 0)'),
          mistura: suporta('color', 'color-mix(in lab, red, red)'),
          propriedade: typeof window.CSSPropertyRule !== 'undefined',
          proporcao: suporta('aspect-ratio', '1 / 1'),
          translate: suporta('translate', '1px'),
          seletorWhere: suportaSeletor(':where(a)'),
          telaCheia: !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
        };

        function sn(v) {
          return v ? '<span class="sim">✓ sim</span>' : '<span class="nao">✕ não</span>';
        }
        function linha(k, v) {
          return '<tr><td class="k">' + k + '</td><td class="v">' + v + '</td></tr>';
        }
        document.getElementById('tabela1').innerHTML =
          linha('Navegador', navegador) +
          linha('TV / sistema', tv.length ? tv.join(', ') : '—') +
          linha('Área de desenho', largura + ' × ' + altura) +
          linha('Tela informada', (screen.width || '?') + ' × ' + (screen.height || '?')) +
          linha('Densidade (DPR)', String(Math.round(dpr * 100) / 100)) +
          linha('Base do visual (@layer)', sn(testes.camadas)) +
          linha('Recalcular a grade (ResizeObserver)', sn(testes.resize));
        document.getElementById('tabela2').innerHTML =
          linha('Container queries', sn(testes.container)) +
          linha('Unidades cq', sn(testes.cq)) +
          linha('Espaço no flex (gap)', sn(testes.flexgap)) +
          linha('Cores lab / color-mix', sn(testes.lab) + ' / ' + sn(testes.mistura)) +
          linha('@property', sn(testes.propriedade)) +
          linha('aspect-ratio / translate', sn(testes.proporcao) + ' / ' + sn(testes.translate)) +
          linha(':where() / tela cheia', sn(testes.seletorWhere) + ' / ' + sn(testes.telaCheia));
        document.getElementById('ua').innerHTML = 'Identificação completa: ' + ua.replace(/</g, '&lt;');
        var agora = new Date();
        document.getElementById('hora').innerHTML = 'Teste feito em ' + agora.toLocaleString('pt-BR') + ' • dlgphotos';

        var v = document.getElementById('veredito');
        var textos = [];
        var classe = 'ok';
        if (!testes.camadas) {
          classe = 'ruim';
          textos.push('Navegador MUITO ANTIGO: ele não entende a base do visual do sistema (@layer). A Visão TV não tem como sair certa nele.');
        } else if (!testes.container || !testes.cq) {
          classe = 'atencao';
          textos.push('Navegador sem "container queries": o sistema usa um complemento para ajustar os cards (pode ficar pesado).');
        } else {
          textos.push('Navegador atualizado: entende tudo o que a Visão TV usa.');
        }
        if (!testes.resize || !testes.flexgap) {
          classe = 'ruim';
          textos.push('Faltam recursos básicos de layout (' + (!testes.resize ? 'ResizeObserver' : '') + (!testes.resize && !testes.flexgap ? ' e ' : '') + (!testes.flexgap ? 'gap no flex' : '') + ').');
        }
        if (largura < 1600) {
          if (classe === 'ok') classe = 'atencao';
          textos.push('A TV desenha numa área pequena (' + largura + ' × ' + altura + '): os cards ficam apertados.');
        }
        v.className = 'veredito ' + classe;
        v.innerHTML = textos.join('<br>');
      })();
    </script>
  </body>
</html>
